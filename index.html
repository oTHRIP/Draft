<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Configurar Sala - DraftBR</title>

    <link
        rel="stylesheet"
        href="room.css"
    >

</head>

<body>

    <main class="room-page">

        <header class="room-header">

            <div class="logo">

                <div class="logo-ball">
                    ⚽
                </div>

                <span>
                    Draft<span>BR</span>
                </span>

            </div>

        </header>


        <section class="setup-container">

            <div class="setup-card">

                <div class="setup-title">

                    <span class="setup-tag">
                        NOVA SALA
                    </span>

                    <h1>
                        Configure sua sala
                    </h1>

                    <p>
                        Defina o limite de jogadores
                        e escolha seu nome.
                    </p>

                </div>


                <div class="form-group">

                    <label for="creatorName">
                        Seu nome
                    </label>

                    <input
                        id="creatorName"
                        type="text"
                        maxlength="20"
                        placeholder="Digite seu nome"
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Quantidade máxima de jogadores
                    </label>

                    <div
                        id="playerLimit"
                        class="player-options"
                    >

                        <button data-value="2">
                            2
                        </button>

                        <button data-value="3">
                            3
                        </button>

                        <button
                            data-value="4"
                            class="selected"
                        >
                            4
                        </button>

                        <button data-value="5">
                            5
                        </button>

                        <button data-value="6">
                            6
                        </button>

                        <button data-value="8">
                            8
                        </button>

                        <button data-value="10">
                            10
                        </button>

                        <button data-value="12">
                            12
                        </button>

                    </div>

                </div>


                <button
                    id="confirmRoomButton"
                    class="primary-button"
                >
                    Criar sala
                </button>


                <p
                    id="setupMessage"
                    class="message"
                ></p>

            </div>

        </section>

    </main>


    <script src="configuracao.js"></script>

</body>

</html>
